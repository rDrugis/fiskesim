# Live-test av Fiskesim med ekte data (Kartverket, NGU, Fiskeridirektoratet, Kystverket, MET).
# Sammenligner fiskeplassalgoritmen med Fiskeguide og tar skjermbilder. Resultatet legges i grenen livetest-results.
name: livetest
on:
  workflow_dispatch:
    inputs:
      only: { description: 'algo, shots eller tomt for alt', required: false, default: 'algo2,raw,shots' }
      art: { description: 'art for hvorfor', required: false, default: 'sei' }
  push:
    branches: [livetest]
permissions:
  contents: write
concurrency: { group: livetest, cancel-in-progress: true }
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund && npm install --no-save --no-audit --no-fund playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/build.mjs
      - name: Hent ferdig utregnet kartdata (bare for «pre»)
        if: contains(github.event.inputs.only, 'pre') || contains(github.event.inputs.only, 'kanter') || contains(github.event.inputs.only, 'dyp') || contains(github.event.inputs.only, 'autorute') || contains(github.event.inputs.only, 'radfjord') || contains(github.event.inputs.only, 'vannkart')
        env: { GH_TOKEN: '${{ github.token }}' }
        run: mkdir -p pre && gh release download kartdata-vestland-v4 -p vestland.tar -D /tmp && tar -xf /tmp/vestland.tar -C pre && find pre -name '*.bin.gz' | wc -l
      - name: Kjør testene
        env: { ONLY: "${{ github.event.inputs.only }}", WHY_ART: "${{ github.event.inputs.art }}" }
        run: node tests/live/run.mjs . 2>&1 | tee tests/live/out-log.txt
      - name: Legg resultatet i grenen livetest-results
        if: always()
        run: |
          mkdir -p /tmp/res && cp -r tests/live/out/* /tmp/res/ 2>/dev/null || true; cp tests/live/out-log.txt /tmp/res/ 2>/dev/null || true
          cd /tmp/res && git init -q && git checkout -q -b livetest-results
          git config user.name "fiskesim-test" && git config user.email "actions@users.noreply.github.com"
          echo "Kjøring ${{ github.run_id }} for ${{ github.sha }}" > README.md
          git add -A && git commit -q -m "Testresultat ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" livetest-results
