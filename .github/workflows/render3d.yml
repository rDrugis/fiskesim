# 3D-bilder av havbunnen uten vann (bare for visning, endrer ikke nettsiden). Bildene legges i grenen render3d-results.
name: render3d
on:
  workflow_dispatch:
    inputs:
      places: { description: 'navn:lat:lon:halvbredde_m[:asimut[:høyde]] ...', required: true }
      dtm_run: { description: 'kjøring med terrengmodellen (dtm)', required: true, default: '45072881841' }
permissions: { contents: write, actions: read }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y gdal-bin python3-gdal python3-numpy python3-matplotlib >/dev/null
      - uses: actions/download-artifact@v4
        with: { name: dtm, path: dtm, run-id: '${{ github.event.inputs.dtm_run }}', github-token: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Hent fiskekartet
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release download kartdata-vestland-v4 -p vestland.tar -D /tmp && mkdir -p pre && tar -xf /tmp/vestland.tar -C pre ./14 2>/dev/null || tar -xf /tmp/vestland.tar -C pre
      - run: python3 tools/render3d/render.py pre dtm/vestland.tif out ${{ github.event.inputs.places }}
      - name: Legg bildene i grenen render3d-results
        if: always()
        run: |
          mkdir -p out && cd out && git init -q && git checkout -q -b render3d-results
          git config user.name "fiskesim-test" && git config user.email "actions@users.noreply.github.com"
          echo "Kjøring ${{ github.run_id }}" > README.md && git add -A && git commit -q -m "3D ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" render3d-results
