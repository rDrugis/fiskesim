# Publiserer nettsiden med den nyeste kontrollerte kartdataen for Vestland (v4: med nabofylker og havområder, v3: med terrengmodellen, ellers v2).
# Krever at Settings → Pages → Source er «GitHub Actions».
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Sett sammen nettsiden
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p _site/pre && cp -r index.html assets LICENSE LICENSES _site/
          T=kartdata-vestland-v2
          for t in kartdata-vestland-v4 kartdata-vestland-v3; do
            if gh release view "$t" --json body -q .body 2>/dev/null | grep -q '^Kontrollert'; then T=$t; break; fi
          done
          echo "kartdata: $T"
          if gh release download "$T" -p vestland.tar -D /tmp; then tar -xf /tmp/vestland.tar -C _site/pre; fi
          echo "fliser: $(find _site/pre -name '*.bin.gz' | wc -l)"; du -sh _site
      - uses: actions/upload-pages-artifact@v4
        with: { path: _site }
      # publiseringen fant flere ganger ikke pakken rett etter opplasting (stor pakke, ca. 800 MB): vent til GitHub viser den
      - name: Vent til pakken er registrert
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for i in $(seq 1 30); do
            n=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' || echo 0)
            if [ "$n" -ge 1 ]; then echo "pakken er registrert etter ${i}0 s"; sleep 15; exit 0; fi
            sleep 10
          done
          echo "pakken er ikke synlig etter 5 min, prøver likevel"
      - id: d
        uses: actions/deploy-pages@v4
