# Publiserer nettsiden med ferdig utregnet kartdata for Vestland: v3 (med terrengmodellen) når den er kontrollert, ellers v2.
# Krever at Settings → Pages → Source er «GitHub Actions».
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Sett sammen nettsiden
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p _site/pre && cp -r index.html assets LICENSE LICENSES _site/
          T=kartdata-vestland-v2
          if gh release view kartdata-vestland-v3 --json body -q .body 2>/dev/null | grep -q '^Kontrollert'; then T=kartdata-vestland-v3; fi
          echo "kartdata: $T"
          if gh release download "$T" -p vestland.tar -D /tmp; then tar -xf /tmp/vestland.tar -C _site/pre; fi
          echo "fliser: $(find _site/pre -name '*.bin.gz' | wc -l)"; du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
