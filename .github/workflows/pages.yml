# Publiserer nettsiden. (Ferdig utregnet kartdata for Vestland er tatt ut igjen 22.11.2026.)
# Krever at Settings → Pages → Source er «GitHub Actions».
name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Sett sammen nettsiden
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p _site/pre && cp -r index.html assets LICENSE LICENSES _site/
          echo "fliser: $(find _site/pre -name '*.bin.gz' | wc -l)"; du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
